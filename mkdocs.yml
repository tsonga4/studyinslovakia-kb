site_name: Study in Slovakia
site_description: Knowledge base and guides for international students in Slovakia
site_url: https://studyinslovakia.info
copyright: © Study in Slovakia

theme:
  name: material
  language: en
  icon:
    logo: material/school
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Faculty of Medicine – UPJŠ Košice:
      - Overview: lf-upjs/index.md
      - Offices & contacts: lf-upjs/contacts.md
      - Campus & locations: lf-upjs/campus.md
      - Canteen (Menza): lf-upjs/canteen.md
      - Library: lf-upjs/library.md
      - Housing & dormitories: lf-upjs/housing.md
      - IT systems: lf-upjs/it-systems.md
      - Health & insurance: lf-upjs/health.md
